<title>movec Demos – demos.movec.services</title>
<meta name="description" content="Interner Demo-Hub für den movec-Vertrieb: alle Produkt-Demos, Pitches und Prototypen an einem Ort.">

</head>
<body>
<style>
  :root {
    /* movec CI */
    --orange:      #ED6B06;
    --orange-dk:   #D45F04;
    --orange-soft: rgba(237,107,6,.10);
    --teal:        #00AAA7;
    --teal-dk:     #00807E;
    --teal-soft:   rgba(0,170,167,.10);
    --grey-mark:   #63656A;

    --paper:   #FFFFFF;
    --paper-2: #F4F6F7;
    --ink:     #24272B;
    --ink-2:   #5A5E66;
    --line:    #E3E7E9;
    --radius:  14px;
    --shadow:  0 6px 24px rgba(36,39,43,.07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Segoe UI", Roboto, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); background: var(--paper); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Nav ---------- */
  .nav {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { display: inline-flex; align-items: center; text-decoration: none; }
  .logo svg { display: block; }
  .nav .right { display: flex; align-items: center; gap: 14px; }
  .nav .tag {
    font-size: 12px; font-weight: 600; letter-spacing: .04em;
    color: var(--grey-mark); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 12px; background: var(--paper-2);
    white-space: nowrap;
  }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button {
    border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 700;
    letter-spacing: .04em; padding: 5px 12px; cursor: pointer; color: var(--ink-2);
  }
  .lang button.active { background: var(--ink); color: #fff; }

  /* ---------- Hero ---------- */
  .hero { padding: 56px 0 36px; }
  .hero h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.15; letter-spacing: -.01em; }
  .hero h1 em { font-style: normal; color: var(--orange); }
  .hero p.sub { margin-top: 12px; max-width: 62ch; color: var(--ink-2); font-size: 17px; }
  .hero .hint {
    margin-top: 20px; display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--ink-2);
    background: var(--teal-soft); border: 1px solid rgba(0,170,167,.25);
    border-radius: 10px; padding: 8px 14px;
  }
  .hero .hint b { color: var(--teal-dk); font-weight: 600; }

  /* ---------- Kategorien ---------- */
  .cat { padding: 26px 0 8px; }
  .cat-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  .cat-head h2 { font-size: 22px; letter-spacing: .01em; }
  .cat-head .chip {
    font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    border-radius: 6px; padding: 3px 9px; color: #fff;
  }
  .cat[data-accent="teal"]   .chip { background: var(--teal); }
  .cat[data-accent="orange"] .chip { background: var(--orange); }
  .cat p.desc { color: var(--ink-2); font-size: 14.5px; max-width: 70ch; }

  .grid {
    margin-top: 18px;
    display: grid; gap: 16px;
    /* 280px, damit „Demo öffnen“ und „Präsentation“ in einer Zeile bleiben */
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    display: flex; flex-direction: column;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px 20px 18px;
    box-shadow: var(--shadow);
    border-top: 3px solid var(--line);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card.live:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(36,39,43,.11); }
  .cat[data-accent="teal"]   .card.live { border-top-color: var(--teal); }
  .cat[data-accent="orange"] .card.live { border-top-color: var(--orange); }
  .card h3 { font-size: 17px; letter-spacing: -.005em; }
  .card h3 .suffix { font-weight: 400; color: var(--ink-2); }
  .card p { margin-top: 6px; font-size: 14px; color: var(--ink-2); flex: 1; }
  .card .row { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 600; text-decoration: none;
    border-radius: 9px; padding: 8px 14px; border: 1px solid transparent;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn.solid { background: var(--orange); color: #fff; }
  .btn.solid:hover { background: var(--orange-dk); }
  .btn.ghost { border-color: var(--line); color: var(--ink); background: var(--paper); }
  .btn.ghost:hover { border-color: var(--teal); color: var(--teal-dk); }
  .doclink {
    flex-basis: 100%; margin-top: 4px;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 600; text-decoration: none;
    color: var(--teal-dk); transition: color .15s ease;
  }
  .doclink::after { content: "→"; font-weight: 400; }
  .doclink:hover { color: var(--teal); text-decoration: underline; }
  .soon {
    font-size: 12.5px; font-weight: 600; color: var(--grey-mark);
    background: var(--paper-2); border: 1px dashed var(--line);
    border-radius: 999px; padding: 6px 12px;
  }

  /* ---------- Footer ---------- */
  footer { margin-top: 56px; border-top: 1px solid var(--line); background: var(--paper-2); }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; padding-top: 22px; padding-bottom: 26px; }
  footer, footer a { font-size: 13px; color: var(--ink-2); }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--orange); }
  footer .links { display: flex; gap: 18px; }

  @media (max-width: 560px) {
    .nav .tag { display: none; }
    .hero { padding-top: 40px; }
  }
</style>

let lang = "de";
const t = (v) => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] || v.de) : v;

const catalogEl = document.getElementById("catalog");

function render() {
  document.documentElement.lang = lang;
  document.getElementById("ui-tag").textContent = t(UI.tag);
  document.getElementById("ui-title").innerHTML = t(UI.title);
  document.getElementById("ui-sub").textContent = t(UI.sub);
  document.getElementById("ui-hint").innerHTML = t(UI.hint);
  document.getElementById("ui-imprint").textContent = t(UI.imprint);
  document.getElementById("ui-privacy").textContent = t(UI.privacy);

  catalogEl.innerHTML = "";
  for (const cat of CATALOG) {
    const section = document.createElement("section");
    section.className = "cat";
    section.dataset.accent = cat.accent;
    section.innerHTML = `
      <div class="cat-head"><span class="chip">${cat.category}</span></div>
      <p class="desc">${t(cat.desc)}</p>
      <div class="grid"></div>`;
    const grid = section.querySelector(".grid");
    for (const p of cat.products) {
      const card = document.createElement("article");
      card.className = "card" + (p.demo || p.pitch ? " live" : "");
      const actions = [
        p.demo  ? `<a class="btn solid" href="${p.demo}" target="_blank" rel="noopener">${t(UI.demoBtn)}</a>` : "",
        p.pitch ? `<a class="btn ${p.demo ? "ghost" : "solid"}" href="${p.pitch}" target="_blank" rel="noopener">${t(UI.pitchBtn)}</a>` : "",
        p.doku  ? `<a class="doclink" href="${p.doku}" target="_blank" rel="noopener">${t(UI.docBtn)}</a>` : "",
        p.status || (!p.demo && !p.pitch) ? `<span class="soon">${t(p.status) || t(UI.demoSoon)}</span>` : ""
      ].join("");
      card.innerHTML = `<h3>${t(p.name)}</h3><p>${t(p.desc)}</p><div class="row">${actions}</div>`;
      grid.appendChild(card);
    }
    catalogEl.appendChild(section);
  }
}

function setLang(l) {
  lang = (l === "en") ? "en" : "de";
  document.querySelectorAll(".lang button").forEach((b) => {
    const on = b.getAttribute("data-lang") === lang;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  try { localStorage.setItem("demohub-lang", lang); } catch (e) {}
  render();
}

document.querySelectorAll(".lang button").forEach((b) => {
  b.addEventListener("click", () => setLang(b.getAttribute("data-lang")));
});
